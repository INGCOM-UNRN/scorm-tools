[project]
name = "scorm-tools"
version = "0.2.0"
description = "Herramientas para crear, empaquetar y validar contenido SCORM (1.2 / 2004) para Moodle."
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "jinja2>=3.1.6",
    "lxml>=5.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    # Núcleo común del ecosistema (N-ECO-14): TyperConErrores y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN/yutani@6e42d7ab8b89a1084381f8aea0999a498a844f6c",
]

[project.scripts]
scorm-tools = "scorm_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorm_tools"]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados; sin el extra se usa el camino propio (gcc, sin sandbox de nostromo…).
ecosistema = [
    "bishop @ git+https://github.com/INGCOM-UNRN-P1/bishop@55c4d1e0d16806201af4ce7f4ffdc79105422fcd",
    "kaneda @ git+https://github.com/INGCOM-UNRN-P1/kaneda@688620f7c7044e89dadef65ef30bf668faafd867",
    "spunkmeyer @ git+https://github.com/INGCOM-UNRN-P1/spunkmeyer@26c618af3ac4dd88bb5b930f478351f45ef67dd7",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN/scorm-tools"
Repository = "https://github.com/INGCOM-UNRN/scorm-tools.git"
Issues = "https://github.com/INGCOM-UNRN/scorm-tools/issues"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[tool.mypy]
# Tipos del paquete (N-ECO-08): `uv run --with mypy mypy`, igual que el CI.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
