[project]
name = "scorm-tools"
version = "0.1.0"
description = "Herramientas para crear, empaquetar y validar contenido SCORM (1.2 / 2004) para Moodle."
readme = "README.md"
authors = [
    { name = "Martín René", email = "martinvilu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "lxml>=6.1.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
scorm-tools = "scorm_tools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scorm_tools"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
